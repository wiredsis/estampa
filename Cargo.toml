[package]
name = "estampa"
version = "0.1.3"
edition = "2021"
repository = "https://git.sr.ht/~nixgoat/estampa"
authors = ["Lux Aliaga <me@lux.rip>"]
license = "AGPL-3.0-or-later"

[dependencies]
blake3 = "1.8"
chrono = "0.4"
pem = "4"
rustls-pemfile = "2.2"
sha2 = "0.11"
thiserror = "2.0"
time = "0.3"
tokio-rustls = "0.26"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dependencies.clap]
version = "4.6"
features = ["derive"]

[dependencies.rcgen]
version = "0.14"
features = ["pem", "crypto", "x509-parser", "aws_lc_rs"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.tokio]
version = "1.53"
features = ["fs", "io-util", "macros", "net", "rt-multi-thread"]

[dependencies.x509-parser]
version = "0.18"
features = ["verify"]

[dev-dependencies]
tempfile = "3.27"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
